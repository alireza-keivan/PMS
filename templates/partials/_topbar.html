{% load i18n %}
<header class="flex h-16 flex-shrink-0 items-center gap-4 border-b border-sand-200 bg-white px-4 sm:px-6 lg:px-8">
  <button
    type="button"
    class="text-ink-600 hover:text-ink-900 lg:hidden"
    @click="sidebarOpen = !sidebarOpen"
    aria-label="{% translate 'Open menu' %}"
  >
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
    </svg>
  </button>

  <div class="ml-auto flex items-center gap-4">
    {% if organization %}
      <span class="text-sm text-ink-600">{{ organization.name }}</span>
    {% endif %}
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="text-sm text-ink-600 underline">{% translate "Log out" %}</button>
    </form>
  </div>
</header>
