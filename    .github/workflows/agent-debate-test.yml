name: Agent Debate (TEST - 2 rounds)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to post the test debate to"
        required: true
        type: string

# Minimum viable permissions: read the code, comment on issues. Nothing else.
permissions:
  contents: read
  issues: write

concurrency:
  group: agent-debate-test-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only the repo owner may run this
        if: github.actor != github.repository_owner
        run: |
          echo "Actor '${{ github.actor }}' is not the repository owner. Aborting."
          exit 1

  debate:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15   # hard ceiling so a stuck run can't burn budget/minutes
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir requests

      - name: Run 2-round test debate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          python scripts/agent_debate.py \
            --rounds 2 \
            --model claude-haiku-4-5-20251001 \
            --max-tokens 400 \
            --test-mode
