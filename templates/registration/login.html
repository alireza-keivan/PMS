{% extends "base_auth.html" %}
{% load i18n %}

{% block title %}{% translate "Log in" %}{% endblock %}

{% block content %}
<div class="w-full max-w-sm rounded-lg border border-sand-200 bg-white p-6 shadow-sm">
  <h1 class="mb-4 text-lg font-semibold text-ink-900">{% translate "Log in" %}</h1>

  {% if form.errors %}
    <p class="mb-4 rounded bg-red-50 p-3 text-sm text-red-700">
      {% translate "That email or password isn't right. Try again." %}
    </p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label class="mb-1 block text-sm text-ink-600" for="id_username">{% translate "Email" %}</label>
    <input
      type="email" name="username" id="id_username" required autofocus
      class="mb-4 w-full rounded border border-sand-200 px-3 py-2 focus:border-teal-500 focus:outline-none"
    >
    <label class="mb-1 block text-sm text-ink-600" for="id_password">{% translate "Password" %}</label>
    <input
      type="password" name="password" id="id_password" required
      class="mb-4 w-full rounded border border-sand-200 px-3 py-2 focus:border-teal-500 focus:outline-none"
    >
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="w-full rounded bg-teal-600 py-2 font-medium text-white hover:bg-teal-500">
      {% translate "Log in" %}
    </button>
  </form>
</div>
{% endblock %}
