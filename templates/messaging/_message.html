{% load i18n %}
<div class="flex {% if message.direction == 'out' %}justify-end{% else %}justify-start{% endif %}">
  <div class="max-w-[75%] rounded-lg px-3 py-2 text-sm {% if message.direction == 'out' %}bg-teal-600 text-white{% else %}bg-sand-100 text-ink-900{% endif %}">
    <p class="whitespace-pre-wrap">{{ message.body }}</p>
    <p class="mt-1 text-[11px] {% if message.direction == 'out' %}text-teal-100{% else %}text-ink-600{% endif %}">
      {{ message.when|date:"j M, H:i" }}
      {% if message.direction == 'out' %}
        · {{ message.status_display }}
        {% if message.status == 'failed' and message.error %} - {{ message.error }}{% endif %}
      {% endif %}
    </p>
  </div>
</div>
